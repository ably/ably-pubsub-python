# This workflow will install Python dependencies, run tests and lint with a variety of Python versions.
# Based upon:
#   https://github.com/actions/starter-workflows/blob/main/ci/python-package.yml
# As directed from:
#   https://docs.github.com/en/actions/guides/building-and-testing-python#starting-with-the-python-workflow-template

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra crypto --extra dev
      - name: Generate rest sync code and tests
        run: uv run --extra crypto --extra dev unasync
      - name: Test with pytest
        run: uv run --extra crypto --extra dev pytest --verbose --tb=short --capture=no
