name: Features

on:
  pull_request:
  push:
    branches:
      - main

# One run per pull request; a new event supersedes the one in flight.
# Pushes to main and manual runs group by ref and always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read       # checkout
      deployments: write   # ably/sdk-upload-action
      id-token: write      # aws-actions/configure-aws-credentials (OIDC)
    uses: ably/features/.github/workflows/sdk-features.yml@main
    with:
      repository-name: ably-pubsub-python
    secrets: inherit
